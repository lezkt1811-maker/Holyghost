<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-labelledby="t">
  <title id="t">Holy Ghost Plumbing ghost mascot wearing a tool belt</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eef8"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset=".5" stop-color="#ffe79a"/>
      <stop offset="1" stop-color="#e9a92a"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M40 100C40 52 68 32 100 32s60 20 60 68v90q-10 15-20 0t-20 0q-10 15-20 0t-20 0q-10 15-20 0t-20 0z"/>
    </clipPath>
  </defs>

  <!-- halo -->
  <ellipse cx="100" cy="20" rx="34" ry="8" fill="none" stroke="url(#halo)" stroke-width="6"/>

  <!-- arms -->
  <ellipse cx="34" cy="118" rx="12" ry="18" transform="rotate(25 34 118)" fill="url(#body)" stroke="#1d3557" stroke-width="4"/>
  <ellipse cx="166" cy="118" rx="12" ry="18" transform="rotate(-25 166 118)" fill="url(#body)" stroke="#1d3557" stroke-width="4"/>

  <!-- body -->
  <path d="M40 100C40 52 68 32 100 32s60 20 60 68v90q-10 15-20 0t-20 0q-10 15-20 0t-20 0q-10 15-20 0t-20 0z"
        fill="url(#body)" stroke="#1d3557" stroke-width="5" stroke-linejoin="round"/>

  <!-- face -->
  <ellipse cx="82" cy="88" rx="8" ry="11" fill="#1d3557"/>
  <ellipse cx="118" cy="88" rx="8" ry="11" fill="#1d3557"/>
  <circle cx="85" cy="84" r="3" fill="#fff"/>
  <circle cx="121" cy="84" r="3" fill="#fff"/>
  <path d="M88 108q12 11 24 0" fill="none" stroke="#1d3557" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="68" cy="104" rx="7" ry="4" fill="#ffb4b4" opacity=".7"/>
  <ellipse cx="132" cy="104" rx="7" ry="4" fill="#ffb4b4" opacity=".7"/>

  <!-- tool belt (clipped to body) -->
  <g clip-path="url(#bodyClip)">
    <rect x="30" y="134" width="140" height="17" fill="#8a5a2b"/>
    <rect x="30" y="134" width="140" height="3" fill="#a87442"/>
    <line x1="30" y1="147" x2="170" y2="147" stroke="#6b4320" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <path d="M40 134h120M40 151h120" stroke="#1d3557" stroke-width="3"/>

  <!-- buckle -->
  <rect x="89" y="130" width="22" height="25" rx="3" fill="none" stroke="#f6c453" stroke-width="4"/>
  <line x1="100" y1="134" x2="100" y2="151" stroke="#f6c453" stroke-width="3"/>

  <!-- hammer in pouch -->
  <rect x="58" y="128" width="6" height="26" rx="2" fill="#c98a4b" stroke="#1d3557" stroke-width="2.5"/>
  <rect x="50" y="122" width="22" height="9" rx="2" fill="#9aa7b4" stroke="#1d3557" stroke-width="2.5"/>
  <!-- pouch -->
  <path d="M50 151h30v22q0 8-8 8H58q-8 0-8-8z" fill="#a0672f" stroke="#1d3557" stroke-width="3" stroke-linejoin="round"/>
  <path d="M50 158h30" stroke="#6b4320" stroke-width="2"/>
  <!-- screwdriver -->
  <rect x="72" y="140" width="5" height="14" rx="2" fill="#2a9df4" stroke="#1d3557" stroke-width="2"/>

  <!-- wrench hanging on right -->
  <g transform="rotate(-12 138 165)">
    <rect x="134" y="148" width="8" height="34" rx="3" fill="#b7c4d1" stroke="#1d3557" stroke-width="3"/>
    <path d="M128 182a10 10 0 1 0 20 0h-6v6h-8v-6z" fill="#b7c4d1" stroke="#1d3557" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="138" cy="152" r="3" fill="#1d3557"/>
  </g>
  <!-- belt loop for wrench -->
  <rect x="131" y="140" width="14" height="12" rx="2" fill="#8a5a2b" stroke="#1d3557" stroke-width="2.5"/>

  <!-- water drop sparkle -->
  <path d="M176 60q-7 10-7 15a7 7 0 0 0 14 0q0-5-7-15z" fill="#2a9df4" stroke="#1d3557" stroke-width="2.5"/>
</svg>
